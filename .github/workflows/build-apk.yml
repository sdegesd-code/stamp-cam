name: Build Stamp Cam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: npm install @capacitor/cli@7.6.10 @capacitor/core@7.6.10 @capacitor/android@7.6.10

      - name: Add Android platform
        run: npx cap add android

      - name: Add camera + location permissions
        run: |
          python3 - << 'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<uses-permission android:name="android.permission.INTERNET" />',
           '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')
          open(p,'w').write(s)
          print('permissions added')
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stamp-cam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
